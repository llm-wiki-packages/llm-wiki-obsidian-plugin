<!doctype html>
<html><head><meta charset="utf-8"><title>Brain plugin preview</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="../styles.css">
<script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
</head>
<body class="theme-light">
<div class="shell"><div class="main" id="main"></div></div>
<script>
  // Icons are drawn after each DOM change; the shim's setIcon leaves <i data-lucide>.
  // Only when an undrawn icon exists: createIcons replaces nodes, which would re-trigger the observer forever.
  let pending = false;
  const draw = () => { pending = false; if (window.lucide && document.querySelector('i[data-lucide]')) lucide.createIcons(); };
  const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(draw); } };
  window.__icons = schedule;
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
</script>
<script src="dist/main.js"></script>
</body></html>
